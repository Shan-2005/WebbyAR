<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0814" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>WebAR – Marker-Based 3D Experience</title>
  <link rel="stylesheet" href="styles.css" />

  <!--
    CONFIRMED working combo for mobile (Android Chrome + iOS Safari):
    A-Frame 1.3.0  +  AR.js 3.4.5 (AR-js-org) via jsDelivr
  -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.3.0/dist/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
</head>
<body>

  <!-- ═══════════════════════════════════════════
       SPLASH SCREEN
       Camera permission requires a user gesture on mobile.
       We show this first — user taps, THEN camera opens.
       ═══════════════════════════════════════════ -->
  <div id="splash">
    <div id="splash-content">
      <div id="splash-icon">🔮</div>
      <h1 id="splash-title">Web<span>AR</span></h1>
      <p id="splash-sub">Marker-based Augmented Reality</p>
      <div id="splash-steps">
        <div class="splash-step">
          <span class="splash-step-num">1</span>
          <span>Tap <strong>Start AR</strong> — allow camera when asked</span>
        </div>
        <div class="splash-step">
          <span class="splash-step-num">2</span>
          <span>Print or open the <strong>Hiro marker</strong> on screen</span>
        </div>
        <div class="splash-step">
          <span class="splash-step-num">3</span>
          <span>Point camera at marker → <strong>3D object appears!</strong></span>
        </div>
      </div>
      <button id="start-btn" onclick="startAR()">
        <span>▶</span> Start AR
      </button>
      <a href="print-marker.html" id="marker-link">🖨️ Get Hiro Marker</a>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       AR SCENE (hidden until Start AR is tapped)
       ═══════════════════════════════════════════ -->
  <div id="ar-wrapper" style="display:none; width:100%; height:100%; position:fixed; top:0; left:0;">

    <a-scene
      id="ar-scene"
      embedded
      arjs="sourceType: webcam;
            debugUIEnabled: false;
            detectionMode: mono;
            patternRatio: 0.75;"
      renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true;"
      vr-mode-ui="enabled: false"
      loading-screen="enabled: false"
    >
      <a-light type="ambient"     color="#ffffff" intensity="0.7"></a-light>
      <a-light type="directional" color="#ffffff" intensity="1.2" position="1 2 1"></a-light>
      <a-light type="point"       color="#a78bfa" intensity="0.9" position="0 1.5 0" distance="4"></a-light>

      <!-- Hiro Marker — official ARToolKit pattern -->
      <a-marker
        preset="hiro"
        smooth="true"
        smoothCount="5"
        smoothTolerance="0.01"
        smoothThreshold="5"
        emitevents="true"
        id="hiro-marker"
      >
        <a-entity id="ar-object-container"></a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <!-- HUD — only shown inside AR wrapper -->
    <div id="hud">
      <header id="top-bar">
        <div id="logo">
          <div class="icon">🔮</div>
          <div class="brand">Web<span>AR</span></div>
        </div>
        <div id="status-badge">
          <div id="status-dot"></div>
          <span id="status-text">Scanning…</span>
        </div>
      </header>

      <div id="center-area">
        <div id="scan-hint">
          <div class="scan-ring">
            <span class="scan-ring-inner">🎯</span>
          </div>
          <p class="scan-hint-text">Point camera at the <strong>Hiro</strong> marker</p>
        </div>
      </div>

      <footer id="bottom-panel">
        <div id="object-selector" role="group" aria-label="Select 3D object"></div>
        <div id="info-bar">
          <span>Object:</span>
          <span id="current-label">Robot</span>
          <span class="sep">|</span>
          <span>Markers:</span>
          <span id="marker-count">0</span>
        </div>
      </footer>
    </div>

    <!-- Back button -->
    <button id="back-btn" onclick="location.reload()" title="Back to menu">✕</button>
    <a id="print-link" href="print-marker.html" title="Print Marker">🖨️</a>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script>
    // Show the AR scene ONLY after user taps — this ensures the camera
    // permission dialog is triggered by a genuine user gesture.
    function startAR() {
      document.getElementById('splash').style.display = 'none';
      document.getElementById('ar-wrapper').style.display = 'block';
      // Small delay so the DOM renders before AR.js tries to grab the camera
      setTimeout(() => {
        if (typeof initARApp === 'function') initARApp();
      }, 300);
    }
  </script>
  <script src="app.js"></script>
</body>
</html>
