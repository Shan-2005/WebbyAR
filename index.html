<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="WebAR – Marker-based AR. Place 3D objects in the real world using your camera and the Hiro marker." />
  <meta name="theme-color" content="#0a0814" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <title>WebAR – Marker-Based 3D Experience</title>
  <link rel="stylesheet" href="styles.css" />

  <!--
    CONFIRMED WORKING combo (tested on Android + iOS):
    • A-Frame  1.3.0
    • AR.js    3.4.5  from AR-js-org GitHub (NOT the abandoned npm ar.js package)
  -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.3.0/dist/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
</head>
<body>

  <a-scene
    embedded
    arjs="sourceType: webcam;
          debugUIEnabled: false;
          detectionMode: mono_and_matrix;
          matrixCodeType: 3x3;"
    renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true;"
    vr-mode-ui="enabled: false"
    loading-screen="enabled: false"
  >

    <!-- Lighting -->
    <a-light type="ambient"     color="#ffffff" intensity="0.6"></a-light>
    <a-light type="directional" color="#ffffff" intensity="1.2" position="1 2 1"></a-light>
    <a-light type="point"       color="#a78bfa" intensity="0.9" position="0 1.5 0" distance="4"></a-light>

    <!-- Hiro Marker — preset="hiro" uses the built-in ARToolKit Hiro pattern -->
    <a-marker
      preset="hiro"
      smooth="true"
      smoothCount="5"
      smoothTolerance="0.01"
      smoothThreshold="5"
      emitevents="true"
    >
      <!-- 3D objects injected here by app.js -->
      <a-entity id="ar-object-container"></a-entity>
    </a-marker>

    <!-- Camera -->
    <a-entity camera></a-entity>

  </a-scene>

  <!-- HUD OVERLAY -->
  <div id="hud">
    <header id="top-bar">
      <div id="logo">
        <div class="icon">🔮</div>
        <div class="brand">Web<span>AR</span></div>
      </div>
      <div id="status-badge">
        <div id="status-dot"></div>
        <span id="status-text">Scanning…</span>
      </div>
    </header>

    <div id="center-area">
      <div id="scan-hint">
        <div class="scan-ring">
          <span class="scan-ring-inner">🎯</span>
        </div>
        <p class="scan-hint-text">Point camera at the <strong>Hiro</strong> marker</p>
      </div>
    </div>

    <footer id="bottom-panel">
      <div id="object-selector" role="group" aria-label="Select 3D object"></div>
      <div id="info-bar">
        <span>Object:</span>
        <span id="current-label">Robot</span>
        <span class="sep">|</span>
        <span>Markers:</span>
        <span id="marker-count">0</span>
        <span class="sep">|</span>
        <span>WebAR v2</span>
      </div>
    </footer>
  </div>

  <button id="fullscreen-btn" title="Toggle Fullscreen">⛶</button>
  <a id="print-link" href="print-marker.html" title="Print Marker">🖨️</a>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
